<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВидеочатРК</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="значок.png" type="image/png">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:black; overflow:hidden; font-family:Arial; }
#mainContainer { position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; }
#mainVideo { width:100%; height:100%; object-fit:cover; }
#miniContainer { position:fixed; bottom:100px; right:20px; width:200px; height:150px; border:2px solid red; background:black; border-radius:8px; overflow:hidden; z-index:10; cursor:move; touch-action:none; }
#miniVideo { width:100%; height:100%; object-fit:cover; }
.controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:15px; z-index:20; }
.btn { width:50px; height:50px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:24px; color:white; background:rgba(50,50,50,0.7); }
.btn.red { background:red; }
.btn:active { transform:scale(0.9); }
#joinForm { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:30; color:white; text-align:center; }
#joinForm input { padding:5px 10px; font-size:16px; margin-bottom:5px; width:200px; }
#joinForm button { padding:5px 15px; font-size:16px; }
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>

<div id="joinForm">
    <input id="userName" placeholder="Ваше имя"><br>
    <input id="roomID" placeholder="ID комнаты"><br>
    <button id="joinBtn" type="button">Войти</button>
</div>

<div id="mainContainer">
    <video id="mainVideo" autoplay playsinline></video>
</div>

<div id="miniContainer">
    <video id="miniVideo" autoplay playsinline muted></video>
</div>

<div class="controls">
    <button id="btnMic" class="btn"><span class="material-icons">mic</span></button>
    <button id="btnCam" class="btn"><span class="material-icons">videocam</span></button>
    <button id="btnSwitch" class="btn"><span class="material-icons">flip_camera_android</span></button>
    <button id="btnEnd" class="btn red"><span class="material-icons">call_end</span></button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

const SERVER_URL = "https://videoc-hatrk-server.onrender.com";
const socket = io(SERVER_URL);

let localStream, peerConnection;
let isMicOn = true, isCamOn = true, usingFrontCam = true;
let roomID, userName;

const config = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:turn.openrelay.metered.live:443', username: 'openrelayproject', credential: 'openrelayprojectsecret' }
    ]
};

async function startLocalStream() {
    localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFrontCam ? "user" : "environment" },
        audio: true
    });
    document.getElementById('miniVideo').srcObject = localStream;
}

async function createPeerConnection() {
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => document.getElementById('mainVideo').srcObject = event.streams[0];
    peerConnection.onicecandidate = event => {
        if(event.candidate) socket.emit('ice-candidate', { roomID, candidate: event.candidate });
    };

    peerConnection.oniceconnectionstatechange = () => console.log('ICE state:', peerConnection.iceConnectionState);
    peerConnection.onconnectionstatechange = () => console.log('Peer state:', peerConnection.connectionState);
}

// Socket.IO события
socket.on('user-joined', async ({ id, name }) => {
    if(!peerConnection) await createPeerConnection();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('offer', { roomID, offer });
});

socket.on('existing-users', async users => {
    if(!peerConnection) await createPeerConnection();
    for(const u of users){
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', { roomID, offer });
    }
});

socket.on('offer', async ({ from, offer }) => {
    if(!peerConnection) await createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', { roomID, answer });
});

socket.on('answer', async ({ from, answer }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('ice-candidate', async ({ from, candidate }) => {
    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }
    catch(e){ console.error(e); }
});

// Вход в комнату
document.getElementById("joinBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    userName = document.getElementById("userName").value.trim() || "Гость";
    roomID = document.getElementById("roomID").value.trim() || "room1";
    if(!roomID){ alert("Введите ID комнаты!"); return; }

    socket.emit("join-room", { roomID, name: userName });
    document.getElementById("joinForm").style.display = "none";
    await startLocalStream();
});

// Перетаскивание мини-видео и смена мест
(function(){
    const mini = document.getElementById("miniContainer");
    const mainVideo = document.getElementById("mainVideo");
    const miniVideo = document.getElementById("miniVideo");
    let isDragging = false, offsetX=0, offsetY=0;

    function startDrag(x,y){ isDragging=true; offsetX=x-mini.getBoundingClientRect().left; offsetY=y-mini.getBoundingClientRect().top; mini.style.transition="none"; }
    function dragMove(x,y){ if(!isDragging) return; mini.style.left=`${x-offsetX}px`; mini.style.top=`${y-offsetY}px`; }
    function endDrag(){ isDragging=false; mini.style.transition="all 0.2s"; }

    mini.addEventListener("mousedown", e=>startDrag(e.clientX,e.clientY));
    document.addEventListener("mousemove", e=>dragMove(e.clientX,e.clientY));
    document.addEventListener("mouseup", endDrag);

    mini.addEventListener("touchstart", e=>startDrag(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    document.addEventListener("touchmove", e=>dragMove(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    document.addEventListener("touchend", endDrag);

    mini.addEventListener("click", ()=>{
        if(isDragging) return;
        const temp = mainVideo.srcObject;
        mainVideo.srcObject = miniVideo.srcObject;
        miniVideo.srcObject = temp;
    });
})();

// Кнопки управления
document.getElementById('btnMic').addEventListener('click', ()=>{
    isMicOn = !isMicOn;
    localStream.getAudioTracks().forEach(t=>t.enabled=isMicOn);
    document.querySelector('#btnMic .material-icons').textContent = isMicOn?'mic':'mic_off';
});
document.getElementById('btnCam').addEventListener('click', ()=>{
    isCamOn = !isCamOn;
    localStream.getVideoTracks().forEach(t=>t.enabled=isCamOn);
    document.querySelector('#btnCam .material-icons').textContent = isCamOn?'videocam':'videocam_off';
});
document.getElementById('btnSwitch').addEventListener('click', async ()=>{
    usingFrontCam = !usingFrontCam;
    const videoTrack = (await navigator.mediaDevices.getUserMedia({ video:{facingMode:usingFrontCam?"user":"environment"} })).getVideoTracks()[0];
    const sender = peerConnection.getSenders().find(s=>s.track.kind==='video');
    sender.replaceTrack(videoTrack);
    const oldTrack = localStream.getVideoTracks()[0];
    localStream.removeTrack(oldTrack);
    oldTrack.stop();
    localStream.addTrack(videoTrack);
    document.getElementById('miniVideo').srcObject=localStream;
});
document.getElementById('btnEnd').addEventListener('click', ()=>{
    if(peerConnection) peerConnection.close();
    if(localStream) localStream.getTracks().forEach(t=>t.stop());
    window.location.reload();
});

});
</script>
</body>
</html>
