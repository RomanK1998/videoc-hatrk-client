<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Видеочат РК</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body { font-family: Arial; text-align:center; margin:0; background:#000; color:#fff; }
h1 { color:red; margin:10px 0; }
.video-container { display:inline-block; width:45vw; height:40vh; margin:5px; position:relative; border:3px solid red; background:#000; overflow:hidden; }
video { width:100%; height:100%; object-fit:cover; }
#contacts { max-height:300px; overflow-y:auto; margin:10px auto; width:90%; text-align:left; }
.contact { display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #444; }
.contact button { background:red; color:#fff; border:none; padding:4px 8px; cursor:pointer; }
.contact button[disabled] { background:#555; cursor:not-allowed; }
#reconnectOverlay { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); color:white; font-size:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
<h1>Видеочат РК</h1>

<div>
<input id="usernameInput" placeholder="Введите имя">
<button onclick="registerUser()">Зарегистрироваться</button>
</div>

<div id="contacts"></div>

<div class="video-container" id="localContainer">
    <video id="localVideo" autoplay playsinline muted></video>
</div>
<div class="video-container" id="remoteContainer">
    <video id="remoteVideo" autoplay playsinline></video>
</div>

<div id="reconnectOverlay">
    <div>Переподключение…</div>
</div>

<script>
const socket = io('http://localhost:3000'); // заменить на ваш сервер
let localStream, remoteStream, peerConnection;
let myId, currentRoom;

async function registerUser() {
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) return alert("Введите имя");
    socket.emit("register", { username });
}
socket.on("registered", user => { myId = user.id; startLocalStream(); });
socket.on("update-users", users => renderContacts(users));

async function startLocalStream() {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
        document.getElementById('localVideo').srcObject = localStream;
    } catch(e){ console.error(e); }
}

function renderContacts(users) {
    const contactsDiv = document.getElementById('contacts');
    contactsDiv.innerHTML = '';
    users.filter(u=>u.id!==myId).forEach(u=>{
        const div = document.createElement('div'); div.className='contact';
        const status = u.inCallWith ? 'в звонке' : 'свободен';
        const btn = document.createElement('button');
        btn.textContent = u.inCallWith ? 'Присоединиться' : 'Позвонить';
        btn.disabled = false;
        btn.onclick = ()=>callUser(u.id);
        div.innerHTML=`${u.username} (${status})`;
        div.appendChild(btn);
        contactsDiv.appendChild(div);
    });
}

function callUser(toId) {
    socket.emit("call-user", { toId });
}

socket.on("incoming-call", ({fromId, fromName, roomId})=>{
    if(confirm(`${fromName} звонит. Присоединиться?`)){
        currentRoom = roomId;
        socket.emit("accept-call", { roomId });
        createPeerConnection();
    }
});

socket.on("user-busy", ({fromId, fromName})=>{
    if(confirm(`${fromName} уже в звонке. Переподключиться и завершить текущий?`)){
        currentRoom = `room-${fromId}-${myId}`;
        socket.emit("accept-call", { roomId: currentRoom });
        createPeerConnection();
    }
});

// ======= WebRTC =======
const config = { iceServers:[{urls:'stun:stun.l.google.com:19302'}] };
function createPeerConnection() {
    peerConnection = new RTCPeerConnection(config);
    if(localStream) localStream.getTracks().forEach(t=>peerConnection.addTrack(t, localStream));

    peerConnection.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
    peerConnection.onicecandidate = e => { if(e.candidate) socket.emit('ice-candidate', e.candidate); };

    if(currentRoom) createOffer();
}

async function createOffer() {
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('offer', offer);
}

socket.on('offer', async offer=>{
    if(!peerConnection) createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', answer);
});

socket.on('answer', async answer=>{
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('ice-candidate', async candidate=>{
    try{ await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){console.error(e);}
});

socket.on('disconnect', ()=>{ document.getElementById('reconnectOverlay').style.display='flex'; });
socket.on('connect', ()=>{ document.getElementById('reconnectOverlay').style.display='none'; });
</script>
</body>
</html>
