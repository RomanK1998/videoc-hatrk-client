<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВидеочатРК</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body { background:black; color:white; font-family:Arial; margin:0; padding:0; }
h1 { color:red; text-align:center; margin:10px 0; }
#userList { padding:10px; max-width:300px; }
#contacts li { cursor:pointer; padding:5px; border-bottom:1px solid #333; }
#contacts li:hover { background:#222; }
.video-container { display:inline-block; width:45vw; height:40vh; margin:5px; border:2px solid red; position:relative; }
video { width:100%; height:100%; object-fit:cover; }
.controls { text-align:center; margin:10px; }
button { padding:8px 12px; margin:5px; border:none; border-radius:5px; }
button.red { background:red; color:white; }
button.green { background:green; color:white; }
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
<h1>Видеочат РК</h1>

<div id="registerDiv">
  <input type="text" id="usernameInput" placeholder="Ваше имя">
  <button id="btnRegister">Зарегистрироваться</button>
</div>

<div id="userList" style="display:none;">
  <h2>Контакты</h2>
  <ul id="contacts"></ul>
</div>

<div class="video-container">
  <video id="localVideo" autoplay playsinline muted></video>
</div>
<div class="video-container">
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div class="controls">
  <button id="btnEnd" class="red">Завершить звонок</button>
</div>

<script>
const socket = io('https://videoc-hatrk-server.onrender.com');
let localStream, remoteStream;
let peerConnection;
let myId;

// Проверяем, есть ли сохранённый ID
const savedUserId = localStorage.getItem("userId");

// ===== Регистрация =====
document.getElementById('btnRegister').onclick = async () => {
  let username = document.getElementById('usernameInput').value.trim();

  if(!username && !savedUserId) return alert("Введите имя!");

  socket.emit("register", { username, userId: savedUserId }, (res) => {
    if(res.success){
      localStorage.setItem("userId", res.id); // сохраняем навсегда
      myId = res.id;
      document.getElementById('registerDiv').style.display = "none";
      document.getElementById('userList').style.display = "block";
      startLocalStream();
    }
  });
};

// Если есть сохранённый ID — автоматически подключаемся
if(savedUserId){
  socket.emit("register", { username:null, userId: savedUserId }, (res) => {
    if(res.success){
      myId = res.id;
      document.getElementById('registerDiv').style.display = "none";
      document.getElementById('userList').style.display = "block";
      startLocalStream();
    }
  });
}

// ===== Список контактов =====
socket.on("update-users", users => {
  const list = document.getElementById("contacts");
  list.innerHTML = "";
  users.forEach(user => {
    if(user.id === myId) return;
    const li = document.createElement("li");
    li.textContent = `${user.username} (${user.status})`;
    li.style.color = user.status==="busy"?"red":"green";
    li.onclick = () => {
      if(user.status==="online") callUser(user.id);
      else if(user.status==="busy") alert(`${user.username} занят. Можно переключиться после завершения текущего звонка.`);
    };
    list.appendChild(li);
  });
});

// ===== Локальное видео =====
async function startLocalStream(){
  try {
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('localVideo').srcObject = localStream;
  } catch(e){ console.error(e); }
}

// ===== Вызов =====
async function callUser(targetId){
  peerConnection = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
  };

  peerConnection.onicecandidate = e => {
    if(e.candidate) socket.emit("ice-candidate", targetId, e.candidate);
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit("call-user", targetId, offer);
}

// ===== Принятие звонка =====
socket.on("incoming-call", async (fromId, offer, username) => {
  if(peerConnection) peerConnection.close();
  peerConnection = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
  peerConnection.onicecandidate = e => { if(e.candidate) socket.emit("ice-candidate", fromId, e.candidate); };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit("answer-call", fromId, answer);
});

// ===== Ответ на звонок =====
socket.on("call-answered", async (answer) => {
  await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

// ===== ICE кандидаты =====
socket.on("ice-candidate", async (candidate) => {
  try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){console.error(e);}
});

// ===== Завершение звонка =====
document.getElementById('btnEnd').onclick = () => {
  if(peerConnection) peerConnection.close();
  peerConnection = null;
  socket.emit("end-call");
  document.getElementById('remoteVideo').srcObject = null;
};

socket.on("call-ended", () => {
  if(peerConnection) peerConnection.close();
  peerConnection = null;
  document.getElementById('remoteVideo').srcObject = null;
  alert("Звонок завершён.");
});

// ===== Уведомление если пользователь занят =====
socket.on("user-busy", (targetId) => {
  alert("Пользователь занят, попробуйте позже.");
});
</script>
</body>
</html>
