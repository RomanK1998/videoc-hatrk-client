<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВидеочатРК</title>
<link rel="icon" href="значок.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Стили аналогично предыдущему коду */
body, html { margin:0; padding:0; background:black; font-family:Arial,sans-serif; }
#mainContainer { position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; }
#mainVideo { width:100%; height:100%; object-fit:cover; }
#miniContainer { position:fixed; bottom:100px; right:20px; width:200px; height:150px; border:2px solid red; background:black; border-radius:8px; overflow:hidden; z-index:10; cursor:move; touch-action:none; }
#miniVideo { width:100%; height:100%; object-fit:cover; }
.controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:15px; z-index:20; }
.btn { width:50px; height:50px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; background:rgba(50,50,50,0.7); }
.btn.red { background:red; }
.btn:active { transform:scale(0.9); }
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>

<div>
  <input id="inputName" placeholder="Ваше имя">
  <input id="inputRoom" placeholder="ID комнаты">
  <button id="btnJoin">Войти</button>
</div>

<div id="mainContainer"><video id="mainVideo" autoplay playsinline></video></div>
<div id="miniContainer"><video id="miniVideo" autoplay playsinline muted></video></div>
<div class="controls">
  <button id="btnMic" class="btn">🎤</button>
  <button id="btnCam" class="btn">📷</button>
  <button id="btnSwitch" class="btn">🔄</button>
  <button id="btnEnd" class="btn red">📞</button>
</div>

<script>
let socket, localStream, peerConnection, usingFrontCam = true;
let isMicOn = true, isCamOn = true;
let roomID, name;

const config = { 
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:turn.openrelay.metered.live:443', username: 'openrelayproject', credential: 'openrelayprojectsecret' }
  ]
};

document.getElementById('btnJoin').onclick = async () => {
  name = document.getElementById('inputName').value || "Гость";
  roomID = document.getElementById('inputRoom').value || "1";
  socket = io('https://videoc-hatrk-server.onrender.com');

  socket.on('connect', () => console.log('Socket connected', socket.id));
  socket.emit('join-room', { roomID, name });

  socket.on('existing-users', users => {
    users.forEach(u => console.log('Существующий пользователь:', u));
  });

  socket.on('offer', async ({ from, offer }) => {
    if(!peerConnection) await createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', { roomID, answer });
  });

  socket.on('answer', async ({ from, answer }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
  });

  socket.on('ice-candidate', async ({ from, candidate }) => {
    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } 
    catch(e){ console.error(e); }
  });

  await startLocalStream();
  await createPeerConnection();
  createOffer();
};

async function startLocalStream(){
  localStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:usingFrontCam?"user":"environment"}, audio:true });
  document.getElementById('miniVideo').srcObject = localStream;
}

async function createPeerConnection(){
  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  peerConnection.ontrack = e => { document.getElementById('mainVideo').srcObject = e.streams[0]; };
  peerConnection.onicecandidate = e => { if(e.candidate) socket.emit('ice-candidate', { roomID, candidate:e.candidate }); };
}

async function createOffer(){
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('offer', { roomID, offer });
}

// Миниатюра и кнопки
(function enableMiniatureControls(){
  const mini = document.getElementById("miniContainer");
  const mainVideo = document.getElementById("mainVideo");
  const miniVideo = document.getElementById("miniVideo");
  let isDragging = false, offsetX=0, offsetY=0;
  mini.addEventListener("mousedown", e=>{isDragging=true;offsetX=e.clientX-mini.offsetLeft;offsetY=e.clientY-mini.offsetTop; mini.style.transition="none";});
  document.addEventListener("mousemove", e=>{if(isDragging){mini.style.left=(e.clientX-offsetX)+"px"; mini.style.top=(e.clientY-offsetY)+"px";}});
  document.addEventListener("mouseup", ()=>{isDragging=false; mini.style.transition="all 0.2s";});
  mini.addEventListener("touchstart", e=>{const t=e.touches[0]; isDragging=true; offsetX=t.clientX-mini.offsetLeft; offsetY=t.clientY-mini.offsetTop; mini.style.transition="none";}, {passive:true});
  document.addEventListener("touchmove", e=>{const t=e.touches[0]; if(isDragging){mini.style.left=(t.clientX-offsetX)+"px"; mini.style.top=(t.clientY-offsetY)+"px";}}, {passive:true});
  document.addEventListener("touchend", ()=>{isDragging=false; mini.style.transition="all 0.2s";});
  mini.addEventListener("click", ()=>{const temp=mainVideo.srcObject; mainVideo.srcObject=miniVideo.srcObject; miniVideo.srcObject=temp;});
})();

document.getElementById('btnMic').onclick = ()=>{isMicOn=!isMicOn; localStream.getAudioTracks().forEach(t=>t.enabled=isMicOn);};
document.getElementById('btnCam').onclick = ()=>{isCamOn=!isCamOn; localStream.getVideoTracks().forEach(t=>t.enabled=isCamOn);};
document.getElementById('btnSwitch').onclick = async ()=>{
  usingFrontCam = !usingFrontCam;
  const videoTrack = (await navigator.mediaDevices.getUserMedia({ video:{facingMode:usingFrontCam?"user":"environment"} })).getVideoTracks()[0];
  const sender = peerConnection.getSenders().find(s=>s.track.kind==='video');
  sender.replaceTrack(videoTrack);
  localStream.removeTrack(localStream.getVideoTracks()[0]);
  localStream.addTrack(videoTrack);
  document.getElementById('miniVideo').srcObject = localStream;
};
document.getElementById('btnEnd').onclick = ()=>{
  if(peerConnection) peerConnection.close();
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  window.location.reload();
};
</script>
</body>
</html>
