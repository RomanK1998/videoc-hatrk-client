<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВидеочатРК</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body { margin:0; padding:0; font-family: Arial, sans-serif; background: #000; color:#fff; }
h1 { text-align:center; color:#25D366; margin:10px 0; font-size:24px; }
#registerDiv { text-align:center; margin:10px 0; }
#usernameInput { padding:8px; width:200px; border-radius:5px; border:none; }
#btnRegister { padding:8px 12px; border:none; border-radius:5px; background:#25D366; color:#fff; cursor:pointer; }
#userList { display:none; padding:10px; max-width:300px; }
#contacts li { cursor:pointer; padding:10px; border-bottom:1px solid #333; list-style:none; }
#contacts li:hover { background:#111; }
#contacts li.online { color:#25D366; }
#contacts li.busy { color:#ff3b30; }

.video-container { position: relative; width: 100%; height: 60vh; background:black; overflow:hidden; }
video { width: 100%; height: 100%; object-fit: cover; }

#localVideo { position: absolute; width:120px; height:160px; bottom: 80px; right: 10px; border-radius:8px; border:2px solid #25D366; background:black; z-index:10; }

.controls { position:fixed; bottom:0; width:100%; display:flex; justify-content:center; padding:10px 0; background: rgba(0,0,0,0.5); }
button { margin:0 15px; border:none; border-radius:50%; width:60px; height:60px; font-size:24px; cursor:pointer; }
button.green { background:#25D366; color:white; }
button.red { background:#ff3b30; color:white; }
@media(max-width:768px){
    .video-container { height:50vh; }
    #localVideo { width:100px; height:130px; bottom:70px; right:10px; }
    button { width:50px; height:50px; font-size:20px; margin:0 10px; }
}
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
<h1>Видеочат РК</h1>

<div id="registerDiv">
  <input type="text" id="usernameInput" placeholder="Ваше имя">
  <button id="btnRegister">Зарегистрироваться</button>
</div>

<div id="userList">
  <h2>Контакты</h2>
  <ul id="contacts"></ul>
</div>

<div class="video-container">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
</div>

<div class="controls">
  <button id="btnEnd" class="red">⏹</button>
</div>

<script>
const socket = io('https://videoc-hatrk-server.onrender.com');
let localStream, remoteStream;
let peerConnection;
let myId;

// ===== Регистрация =====
document.getElementById('btnRegister').onclick = async () => {
  const username = document.getElementById('usernameInput').value.trim();
  if(!username) return alert("Введите имя!");
  socket.emit("register", username, (res) => {
    if(res.success){
      myId = res.id;
      document.getElementById('registerDiv').style.display = "none";
      document.getElementById('userList').style.display = "block";
      startLocalStream();
    }
  });
};

// ===== Список контактов =====
socket.on("update-users", users => {
  const list = document.getElementById("contacts");
  list.innerHTML = "";
  users.forEach(user => {
    if(user.id === myId) return;
    const li = document.createElement("li");
    li.textContent = user.username;
    li.className = user.status;
    li.onclick = () => {
      if(user.status==="online") callUser(user.id);
      else if(user.status==="busy") alert(`${user.username} занят. Можно переключиться после завершения текущего звонка.`);
    };
    list.appendChild(li);
  });
});

// ===== Локальное видео =====
async function startLocalStream(){
  try {
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('localVideo').srcObject = localStream;
  } catch(e){ console.error(e); }
}

// ===== Вызов =====
async function callUser(targetId){
  peerConnection = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
  };

  peerConnection.onicecandidate = e => {
    if(e.candidate) socket.emit("ice-candidate", targetId, e.candidate);
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit("call-user", targetId, offer);
}

// ===== Принятие звонка =====
socket.on("incoming-call", async (fromId, offer, username) => {
  if(peerConnection) peerConnection.close();
  peerConnection = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
  peerConnection.onicecandidate = e => { if(e.candidate) socket.emit("ice-candidate", fromId, e.candidate); };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit("answer-call", fromId, answer);
});

// ===== Ответ на звонок =====
socket.on("call-answered", async (answer) => {
  await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

// ===== ICE кандидаты =====
socket.on("ice-candidate", async (candidate) => {
  try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){console.error(e);}
});

// ===== Завершение звонка =====
document.getElementById('btnEnd').onclick = () => {
  if(peerConnection) peerConnection.close();
  peerConnection = null;
  socket.emit("end-call");
  document.getElementById('remoteVideo').srcObject = null;
};

socket.on("call-ended", () => {
  if(peerConnection) peerConnection.close();
  peerConnection = null;
  document.getElementById('remoteVideo').srcObject = null;
  alert("Звонок завершён.");
});

// ===== Уведомление если пользователь занят =====
socket.on("user-busy", (targetId) => {
  alert("Пользователь занят, попробуйте позже.");
});
</script>
</body>
</html>
