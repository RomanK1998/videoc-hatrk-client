<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВидеочатРК</title>
<link rel="icon" type="image/png" href="значок.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body, html {
        margin: 0;
        padding: 0;
        background: black;
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
    }
    /* Основное видео */
    #mainContainer {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: black;
    }
    #mainVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    /* Миниатюра своего видео */
    #miniContainer {
        position: fixed;
        bottom: 120px;
        right: 15px;
        width: 120px;
        height: 160px;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #25D366;
        background: black;
        z-index: 10;
        cursor: move;
        touch-action: none;
    }
    #miniVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    /* Панель кнопок */
    .controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 20;
    }
    .btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: white;
        background: rgba(50,50,50,0.7);
        transition: background 0.2s;
    }
    .btn.red { background: red; }
    .btn:active { transform: scale(0.9); }
</style>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>

<div id="mainContainer">
    <video id="mainVideo" autoplay playsinline></video>
</div>

<div id="miniContainer">
    <video id="miniVideo" autoplay playsinline muted></video>
</div>

<div class="controls">
    <button id="btnMic" class="btn">🎤</button>
    <button id="btnCam" class="btn">📷</button>
    <button id="btnSwitch" class="btn">🔄</button>
    <button id="btnEnd" class="btn red">📞</button>
</div>

<script>
const socket = io('https://videoc-hatrk-server.onrender.com');
let localStream, peerConnection;
let isMicOn = true, isCamOn = true;
let usingFrontCam = true;

const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// Получаем локальное видео
async function startLocalStream() {
    localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFrontCam ? "user" : "environment" },
        audio: true
    });
    document.getElementById('miniVideo').srcObject = localStream;
}

// Создаем PeerConnection
async function createPeerConnection() {
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => {
        document.getElementById('mainVideo').srcObject = e.streams[0];
    };
    peerConnection.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', e.candidate);
    };
}

// Socket события
socket.on('offer', async offer => {
    if (!peerConnection) await createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', answer);
});

socket.on('answer', async answer => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('ice-candidate', async candidate => {
    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }
    catch(e){ console.error(e); }
});

// Создаем оффер
async function createOffer() {
    if (!peerConnection) await createPeerConnection();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('offer', offer);
}

// Инициализация
startLocalStream().then(() => setTimeout(createOffer, 2000));

// Перетаскивание миниатюры
(function(){
    const mini = document.getElementById("miniContainer");
    let isDragging=false, offsetX=0, offsetY=0;
    function startDrag(x,y){isDragging=true; offsetX=x-mini.getBoundingClientRect().left; offsetY=y-mini.getBoundingClientRect().top; mini.style.transition="none";}
    function dragMove(x,y){if(!isDragging) return; mini.style.left=`${x-offsetX}px`; mini.style.top=`${y-offsetY}px`;}
    function endDrag(){isDragging=false; mini.style.transition="all 0.2s";}
    mini.addEventListener("mousedown", e=>startDrag(e.clientX,e.clientY));
    document.addEventListener("mousemove", e=>dragMove(e.clientX,e.clientY));
    document.addEventListener("mouseup", endDrag);
    mini.addEventListener("touchstart", e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); }, {passive:true});
    document.addEventListener("touchmove", e=>{ const t=e.touches[0]; dragMove(t.clientX,t.clientY); }, {passive:true});
    document.addEventListener("touchend", endDrag);
    mini.addEventListener("click", ()=>{
        const mainVideo = document.getElementById("mainVideo");
        const miniVideo = document.getElementById("miniVideo");
        const temp = mainVideo.srcObject;
        mainVideo.srcObject = miniVideo.srcObject;
        miniVideo.srcObject = temp;
    });
})();

// Кнопки
document.getElementById('btnMic').addEventListener('click', ()=>{
    isMicOn=!isMicOn;
    localStream.getAudioTracks().forEach(t=>t.enabled=isMicOn);
    document.getElementById('btnMic').textContent=isMicOn?"🎤":"🔇";
});
document.getElementById('btnCam').addEventListener('click', ()=>{
    isCamOn=!isCamOn;
    localStream.getVideoTracks().forEach(t=>t.enabled=isCamOn);
    document.getElementById('btnCam').textContent=isCamOn?"📷":"🚫";
});
document.getElementById('btnSwitch').addEventListener('click', async ()=>{
    usingFrontCam=!usingFrontCam;
    const videoTrack=(await navigator.mediaDevices.getUserMedia({video:{facingMode:usingFrontCam?"user":"environment"}})).getVideoTracks()[0];
    const sender=peerConnection.getSenders().find(s=>s.track.kind==='video');
    sender.replaceTrack(videoTrack);
    localStream.removeTrack(localStream.getVideoTracks()[0]);
    localStream.addTrack(videoTrack);
    document.getElementById('miniVideo').srcObject=localStream;
});
document.getElementById('btnEnd').addEventListener('click', ()=>{
    if(peerConnection) peerConnection.close();
    if(localStream) localStream.getTracks().forEach(t=>t.stop());
    peerConnection=null; localStream=null;
    alert("Вызов завершен");
});

</script>
</body>
</html>
